<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindustry Lite</title>
<!--
  Mindustry Lite: a single-file browser game built from the Mindustry source tree.
  Sprites, sounds, music and font are from Mindustry by Anuken (https://github.com/Anuken/Mindustry),
  licensed under the GNU General Public License v3. This file is a derivative work and is
  distributed under the same license (GPL-3.0). Game logic is a JavaScript re-implementation
  modelled on the original Java code.
-->
<style>
@font-face { font-family: "MindustryFont"; src: url("/*__FONT__*/") format("woff2"); }
:root {
  --accent: #ffd37f;
  --accent-back: #d4816b;
  --panel: rgba(0, 0, 0, 0.72);
  --panel-solid: #1c1c22;
  --line: #454545;
  --gray: #8a8a8a;
  --bad: #e55454;
  --good: #84f491;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff;
  font-family: "MindustryFont", "Courier New", monospace; font-size: 15px; user-select: none; -webkit-user-select: none; }
canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; image-rendering: pixelated; }
.hidden { display: none !important; }
.panel { background: var(--panel); border: 3px solid var(--line); }
button { font-family: inherit; font-size: 15px; color: #fff; background: #000a; border: 3px solid var(--line); padding: 8px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:active { background: #333; }
button.accent { border-color: var(--accent); }

/* wave panel */
#wave { position: fixed; left: 8px; top: 8px; min-width: 240px; padding: 0; display: flex; flex-direction: column; }
#wave .row { display: flex; align-items: stretch; }
#wave .info { flex: 1; padding: 8px 12px; }
#wave .title { color: var(--accent); font-size: 20px; }
#wave .sub { color: #ddd; font-size: 13px; margin-top: 2px; }
#skipWave { border: none; border-left: 3px solid var(--line); padding: 0 12px; display: flex; align-items: center; justify-content: center; }
#skipWave img { width: 28px; height: 28px; image-rendering: pixelated; }
#playerHealth { height: 6px; background: #3a3a3a; }
#playerHealth div { height: 100%; background: var(--accent); width: 100%; }
#items { margin-top: 6px; padding: 6px 10px; display: grid; grid-template-columns: repeat(2, auto); gap: 2px 14px; }
#items .it { display: flex; align-items: center; gap: 6px; font-size: 14px; }
#items img { width: 20px; height: 20px; image-rendering: pixelated; }
#status { margin-top: 6px; padding: 6px 10px; font-size: 13px; color: #ccc; }

/* minimap */
#minimapWrap { position: fixed; right: 8px; top: 8px; padding: 0; }
#minimap { display: block; width: 180px; height: 180px; image-rendering: pixelated; }

/* block menu */
#blockMenu { position: fixed; right: 8px; bottom: 8px; display: flex; flex-direction: column; align-items: stretch; }
#blockInfo { padding: 8px 10px; margin-bottom: 4px; width: 100%; min-height: 40px; }
#blockInfo .name { color: var(--accent); font-size: 16px; }
#blockInfo .desc { color: #bbb; font-size: 12px; margin-top: 4px; max-width: 300px; line-height: 1.3; }
#blockInfo .req { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 5px; font-size: 13px; }
#blockInfo .req span { display: flex; align-items: center; gap: 3px; }
#blockInfo .req img { width: 16px; height: 16px; image-rendering: pixelated; }
#blockInfo .stats { font-size: 12px; color: #ddd; margin-top: 4px; line-height: 1.35; }
#menuBody { display: flex; }
#blocks { display: grid; grid-template-columns: repeat(4, 46px); grid-auto-rows: 46px; padding: 4px; gap: 2px; align-content: start; min-height: 196px; }
#cats { display: grid; grid-template-columns: repeat(2, 42px); grid-auto-rows: 42px; padding: 4px; border-left: 3px solid var(--line); gap: 2px; }
.bbtn { border: 2px solid transparent; background: #0006; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
.bbtn:hover { border-color: #fff6; }
.bbtn.sel { border-color: var(--accent); background: #ffd37f22; }
.bbtn.locked img { opacity: 0.35; }
.bbtn img { width: 32px; height: 32px; image-rendering: pixelated; }
#cats .bbtn img { width: 24px; height: 24px; }

/* hover tooltip */
#hover { position: fixed; pointer-events: none; padding: 6px 9px; font-size: 13px; max-width: 260px; z-index: 5; }
#hover .name { color: var(--accent); }
#hover .bar { height: 4px; background: #333; margin-top: 4px; }
#hover .bar div { height: 100%; }

/* config popup */
#config { position: fixed; padding: 6px; display: grid; grid-template-columns: repeat(4, 38px); gap: 3px; z-index: 6; }
#config .bbtn img { width: 26px; height: 26px; }
#config .wide { grid-column: 1 / -1; font-size: 13px; padding: 5px; text-align: center; color: #ccc; }

/* toasts */
#toasts { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { padding: 8px 18px; font-size: 16px; transition: opacity 0.5s; }

/* overlays */
.overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,0.62); z-index: 20; }
.overlay .box { padding: 22px 30px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; min-width: 300px; max-width: 92vw; }
.overlay h1 { color: var(--accent); margin: 0 0 6px; font-weight: normal; font-size: 30px; text-align: center; }
.overlay p { margin: 0; color: #ccc; text-align: center; line-height: 1.4; }
#title { background: radial-gradient(ellipse at center, rgba(0,0,0,0.35), rgba(0,0,0,0.85)); }
#title img.logo { width: min(560px, 86vw); image-rendering: pixelated; margin-bottom: 22px; }
#controls { font-size: 13px; color: #bbb; display: grid; grid-template-columns: auto auto; gap: 3px 18px; margin-top: 8px; }
#controls b { color: var(--accent); font-weight: normal; }
.credit { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 12px; color: #888; }
.settingRow { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 14px; }
.settingRow input[type=range] { width: 150px; accent-color: #ffd37f; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 30; color: var(--accent); font-size: 22px; }

@media (max-width: 760px) {
  #minimapWrap { display: none; }
  #blocks { grid-template-columns: repeat(4, 40px); grid-auto-rows: 40px; }
  #blockInfo .desc { display: none; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">Loading...</div>

<div id="hud" class="hidden">
  <div id="wave">
    <div class="panel">
      <div class="row">
        <div class="info"><div class="title" id="waveTitle">Wave 1</div><div class="sub" id="waveSub"></div></div>
        <button id="skipWave" title="Skip wave"></button>
      </div>
      <div id="playerHealth"><div></div></div>
    </div>
    <div id="items" class="panel"></div>
    <div id="status" class="panel"></div>
  </div>
  <div id="minimapWrap" class="panel"><canvas id="minimap" width="150" height="150"></canvas></div>
  <div id="blockMenu">
    <div id="blockInfo" class="panel hidden"></div>
    <div id="menuBody" class="panel"><div id="blocks"></div><div id="cats"></div></div>
  </div>
  <div id="hover" class="panel hidden"></div>
  <div id="config" class="panel hidden"></div>
  <div id="toasts"></div>
</div>

<div id="title" class="overlay hidden">
  <img class="logo" id="logoImg" alt="Mindustry">
  <div class="box panel">
    <button class="accent" id="playBtn">Play</button>
    <button id="newMapBtn">New map seed</button>
    <p id="seedText"></p>
    <div id="controls"></div>
  </div>
  <div class="credit">Sprites, sounds, music and font from Mindustry by Anuken &middot; GPL-3.0</div>
</div>

<div id="pause" class="overlay hidden">
  <div class="box panel">
    <h1>Paused</h1>
    <button class="accent" id="resumeBtn">Resume</button>
    <div class="settingRow"><span>Music</span><input type="range" id="musicVol" min="0" max="100" value="50"></div>
    <div class="settingRow"><span>Sound</span><input type="range" id="sfxVol" min="0" max="100" value="70"></div>
    <button id="restartBtn">Restart</button>
    <button id="quitBtn">Quit to title</button>
  </div>
</div>

<div id="gameover" class="overlay hidden">
  <div class="box panel">
    <h1>Core destroyed</h1>
    <p id="goText"></p>
    <button class="accent" id="goRestart">Try again</button>
    <button id="goTitle">Title</button>
  </div>
</div>

<script>
"use strict";
/*__ASSETS__*/
/*__GAME__*/
</script>
</body>
</html>
